            function bucket(store, color, width, alpha, dash, a, b, bend) {
              var key =
                color +
                "|" +
                width.toFixed(2) +
                "|" +
                Math.round(clamp(alpha, 0, 1) * 4) +
                "|" +
                (dash.length ? dash.join(",") : "-");
              var b2 =
                store[key] ||
                (store[key] = { color: color, width: width, alpha: alpha, dash: dash, segs: [] });
              b2.segs.push([a, b, bend]);
            }

            /* 前置依赖：默认极淡，悬浮 / 选中时上色（与 2D 版一致，不做整体淡化） */
            scene.rels.forEach(function (r) {
              var a = proj[r.source.id],
                b = proj[r.target.id];
              var hot = Boolean(active_id) && (r.source.id === active_id || r.target.id === active_id);
              var mid = project({
                x: (r.source.x + r.target.x) / 2 - 22,
                y: (r.source.y + r.target.y) / 2 - 22,
                z: (r.source.z + r.target.z) / 2,
              });
              var bend = { x: mid.x - (a.x + b.x) / 2, y: mid.y - (a.y + b.y) / 2 };
              if (hot) {
                items.push({
                  kind: "edge",
                  a: a,
                  b: b,
                  z: 1e6,
                  hot: true,
                  color: frameAccent,
                  width: 2.3,
                  alpha: 1,
                  dash: [],
                  bend: bend,
                });
                return;
              }
              var store = (a.z + b.z) / 2 >= 0 ? front : back;
              bucket(
                store,
                "#b9c6d6",
                0.9,
                0.22 * (0.55 + 0.45 * clamp(((a.z + b.z) / 2 + scene.shell) / (scene.shell * 2), 0, 1)),
                [3, 4],
                a,
                b,
                bend,
              );
            });

            scene.links.forEach(function (l) {
              var a = proj[l.source.id],
                b = proj[l.target.id];
              var hot = Boolean(active_id) && (l.source.id === active_id || l.target.id === active_id);
              if (hot) {
                items.push({
                  kind: "edge",
                  a: a,
                  b: b,
                  z: 1e6,
                  hot: true,
                  color: frameAccent,
                  width: 2.3,
                  alpha: 1,
                  dash: [],
                });
                return;
              }
              var depth = 0.55 + 0.45 * clamp(((a.z + b.z) / 2 + scene.shell) / (scene.shell * 2), 0, 1);
              var store = (a.z + b.z) / 2 >= 0 ? front : back;
              var lineColor = l.color || (scene.course ? scene.course.color.main : "#cbd7e4");
              /* 银河里课程核到章节的连线是径向长丝：画细一点、淡一点，别把盘面糊成一张蛛网 */
              if (l.level === 1)
                bucket(store, lineColor, 1.2, (scene.galaxy ? 0.3 : 0.6) * depth, [], a, b, null);
              else if (l.level === 2)
                bucket(
                  store,
                  lineColor,
                  scene.galaxy ? 1.1 : 1.7,
                  (scene.galaxy ? 0.3 : 0.72) * depth,
                  [],
                  a,
                  b,
                  null,
                );
              else bucket(store, l.color || "#cbd7e4", 0.95, 0.42 * depth, [], a, b, null);
            });

            shellItems(items);
            items.sort(function (m, n) {
              return m.z - n.z;
            });

            if (scene.dust) drawDust(proj);
            if (scene.wedges && scene.wedges.length) drawWedges(proj);
            /* 先定好谁能铺下标签：铺不下的章节只画一个小标记，不再顶着别人的框 */
            var labelPlan = planLabels(proj);
            drawBuckets(back);
            items.forEach(function (it) {
              if (it.kind === "shell") drawShell(it);
              else if (it.kind === "edge") drawEdge(it);
              else if (it.node.kind === "hub") drawHub(it.node, it.p);
              else if (it.node.kind === "kp") drawKp(it.node, it.p);
              else if (it.node.kind === "chapter")
                drawChapter(it.node, it.p, !labelPlan || labelPlan[it.node.id]);
              else drawCourse(it.node, it.p, active_id);
            });
            drawBuckets(front);

            /* 文字标签单独一遍：从最靠前的节点开始铺，重叠的标签自动让位。
         密集课程（数据结构 64 个知识点）在 3D 里投影后会挤在一起，
         不排重就糊成一团；悬浮 / 选中的标签永远画，保证随时能看清。 */
            drawLabels(proj, active_id, labelPlan);
            /* 跟着鼠标走的信息条：一眼看清指针底下的节点是什么、点进去会去哪 */
            drawMouseTip();
          }

          /* 平面 3D 视角里的课程扇区底色：和 2D 用同一套 a0/a1/r0/r1，投影成倾斜的盘面多边形 */
          function drawWedges(proj) {
            scene.wedges.forEach(function (w) {
              if (typeof w.a0 !== "number") return;
              var seg = 24,
                i,
                a;
              var pts = [];
              for (i = 0; i <= seg; i++) {
                a = w.a0 + (w.a1 - w.a0) * (i / seg);
                pts.push(project({ x: Math.cos(a) * w.r1, y: 0, z: -Math.sin(a) * w.r1 * SY }));
              }
              for (i = seg; i >= 0; i--) {
                a = w.a0 + (w.a1 - w.a0) * (i / seg);
                pts.push(project({ x: Math.cos(a) * w.r0, y: 0, z: -Math.sin(a) * w.r0 * SY }));
              }
              ctx.save();
              ctx.globalAlpha = 0.5 * Math.min(1, easeOut(grow));
              ctx.beginPath();
              pts.forEach(function (p, idx) {
                if (idx) ctx.lineTo(p.x, p.y);
                else ctx.moveTo(p.x, p.y);
              });
              ctx.closePath();
              /* 夜里不做浅色底：改成课程色的一层淡淡辉光 + 一圈更亮的边，扇区归属照样一眼可辨 */
              ctx.fillStyle = rgba(w.color.main, 0.16);
              ctx.fill();
              ctx.lineWidth = 1.1;
              ctx.strokeStyle = rgba(w.color.main, 0.3);
              ctx.stroke();
              ctx.restore();
            });
          }

          /* 把同一类的所有线段合并成一条路径一次描边（比逐条 stroke 快一个数量级） */
          function drawBuckets(store) {
            Object.keys(store).forEach(function (key) {
              var b = store[key];
              ctx.save();
              ctx.strokeStyle = b.color;
              ctx.lineWidth = b.width;
              ctx.globalAlpha = b.alpha;
              if (b.dash.length) ctx.setLineDash(b.dash);
              ctx.beginPath();
              b.segs.forEach(function (s) {
                ctx.moveTo(s[0].x, s[0].y);
                if (s[2])
                  ctx.quadraticCurveTo(
                    (s[0].x + s[1].x) / 2 + s[2].x,
                    (s[0].y + s[1].y) / 2 + s[2].y,
                    s[1].x,
                    s[1].y,
                  );
                else ctx.lineTo(s[1].x, s[1].y);
              });
              ctx.stroke();
              ctx.restore();
            });
          }

          /* 球体精灵缓存：同一个课程色的球只渲染一次，之后 drawImage 缩放使用。
       原来每帧给每个节点 createRadialGradient + shadowBlur 是最大的开销来源。
       vivid = 给单课知识球里的小节点用：整体提亮、外圈少压深，颜色更亮丽。 */
          var sprites = {};
          function sphereSprite(color, size, glow, vivid) {
            var key = color + "|" + size + "|" + (glow ? 1 : 0) + "|" + (vivid ? 1 : 0);
            if (sprites[key]) return sprites[key];
            var pad = glow ? Math.round(size * 0.45) : 1;
            var c = document.createElement("canvas");
            c.width = c.height = (size + pad) * 2;
            var g2 = c.getContext("2d");
            var r = size,
              cx = c.width / 2,
              cy = c.height / 2;
            if (glow) {
              var gl = g2.createRadialGradient(cx, cy, r * 0.8, cx, cy, r + pad);
              gl.addColorStop(0, rgba(color, 0.4));
              gl.addColorStop(1, rgba(color, 0));
              g2.fillStyle = gl;
              g2.beginPath();
              g2.arc(cx, cy, r + pad, 0, Math.PI * 2);
              g2.fill();
            }
            var grad = g2.createRadialGradient(cx - r * 0.34, cy - r * 0.4, r * 0.08, cx, cy, r * 1.08);
            /* 深色底上球体要够「实」：高光收得又小又浅，主体是课程原色，靠外圈压深做立体感；
         亮丽版把高光抬起来、外圈少压深，颜色更透亮 */
            if (vivid) {
              grad.addColorStop(0, tone(color, 0.9, 0.55));
              grad.addColorStop(0.24, tone(color, 0.73, 1));
              grad.addColorStop(0.62, tone(color, 0.63, 1.12));
              grad.addColorStop(1, tone(color, 0.5, 1.15));
            } else {
              grad.addColorStop(0, mixWhite(color, 0.34));
              grad.addColorStop(0.22, mixWhite(color, 0.06));
              grad.addColorStop(0.6, color);
              grad.addColorStop(1, mixBlack(color, 0.3));
            }
            g2.beginPath();
            g2.arc(cx, cy, r, 0, Math.PI * 2);
            g2.fillStyle = grad;
            g2.fill();
            /* 白边：课程球亮一点，小圆点也描一圈白边把轮廓勾出来，但比课程球暗一档 */
            g2.lineWidth = Math.max(1, r * 0.06);
            g2.strokeStyle = "rgba(255,255,255," + (size >= 40 ? 0.7 : vivid ? 0.5 : 0.42) + ")";
            g2.stroke();
            sprites[key] = { canvas: c, box: size + pad };
            return sprites[key];
          }

          function drawEdge(it) {
            ctx.save();
            ctx.globalAlpha = it.alpha;
            ctx.strokeStyle = it.color;
            ctx.lineWidth = it.width;
            if (it.dash && it.dash.length) ctx.setLineDash(it.dash);
            ctx.beginPath();
            ctx.moveTo(it.a.x, it.a.y);
            if (it.bend)
              ctx.quadraticCurveTo(
                (it.a.x + it.b.x) / 2 + it.bend.x,
                (it.a.y + it.b.y) / 2 + it.bend.y,
                it.b.x,
                it.b.y,
              );
            else ctx.lineTo(it.b.x, it.b.y);
            ctx.stroke();
            ctx.restore();
          }

          /* 星空：整页主题是「黑夜星空」，画布上再铺一层会轻轻眨眼的星星 + 柔光星云。
       位置用固定种子生成一次（确定性，切场景不会跳），每帧只画一条路径 + 几十个光点精灵。 */
          var stars = null,
            starSprite = null,
            backdrop = null,
            backdropKey = "";
          function buildStars() {
            var seed = 20260518;
            function rnd() {
              seed = (seed * 1103515245 + 12345) & 0x7fffffff;
              return seed / 0x7fffffff;
            }
            stars = [];
            for (var i = 0; i < 360; i++) {
              var big = i % 13 === 0;
              stars.push({
                x: rnd(),
                y: rnd(),
                r: big ? 1.1 + rnd() * 1.5 : 0.3 + rnd() * 0.8,
                a: big ? 0.55 + rnd() * 0.4 : 0.18 + rnd() * 0.4,
                ph: rnd() * Math.PI * 2,
                sp: 0.35 + rnd() * 0.8,
                big: big,
              });
            }
          }
          function drawStars() {
            if (!stars) buildStars();
            if (!starSprite) starSprite = sphereSprite("#d8e6ff", 12, true);
            var t = performance.now() / 1000,
              i,
              s;
            /* 星空整层烘成一张位图（星星不动，没必要每帧重画几百个点），
         每帧只做一次不透明 drawImage；只有十几颗亮星留在外面各自眨眼。 */
            var key = W + "x" + H + "@" + DPR.toFixed(2);
            if (!backdrop || backdropKey !== key) {
              if (!backdrop) backdrop = document.createElement("canvas");
              backdrop.width = Math.max(1, Math.round(W * DPR));
              backdrop.height = Math.max(1, Math.round(H * DPR));
              var bx = backdrop.getContext("2d");
              bx.setTransform(DPR, 0, 0, DPR, 0, 0);
              /* 底色也跟着烘进去：不透明整块贴图比「清空 + 大量半透明填充」省一大截 */
              var bgGrad = bx.createLinearGradient(0, 0, 0, H);
              bgGrad.addColorStop(0, "#0a1424");
              bgGrad.addColorStop(0.45, "#070d1a");
              bgGrad.addColorStop(1, "#04070e");
              bx.fillStyle = bgGrad;
              bx.fillRect(0, 0, W, H);
              bx.fillStyle = "#cfe0ff";
              bx.globalAlpha = 0.8;
              bx.beginPath();
              for (i = 0; i < stars.length; i++) {
                s = stars[i];
                if (s.big) continue;
                var x = s.x * W,
                  y = s.y * H;
                bx.moveTo(x + s.r, y);
                bx.arc(x, y, s.r, 0, Math.PI * 2);
              }
              bx.fill();
              bx.globalAlpha = 0.5; /* 亮星先淡淡烘一层，闪烁的那层画在上面 */
              for (i = 0; i < stars.length; i++) {
                s = stars[i];
                if (!s.big) continue;
                var d0 = s.r * 1.6;
                bx.drawImage(starSprite.canvas, s.x * W - d0, s.y * H - d0, d0 * 2, d0 * 2);
              }
              backdropKey = key;
            }
            ctx.save();
            ctx.globalAlpha = 1;
            ctx.drawImage(backdrop, 0, 0, W, H);
            ctx.restore();
            /* 亮星闪烁：只留这十几颗逐帧画，成本可以忽略 */
            ctx.save();
            for (i = 0; i < stars.length; i++) {
              s = stars[i];
              if (!s.big) continue;
              var d = s.r * 3.6;
              ctx.globalAlpha = s.a * (0.35 + 0.4 * Math.sin(t * s.sp + s.ph));
              ctx.drawImage(starSprite.canvas, s.x * W - d, s.y * H - d, d * 2, d * 2);
            }
            ctx.restore();
          }

          /* 星云辉光：一层扁平的柔光，把"星空"的氛围撑起来 */
          var nebulaSprite = null;
          function drawNebula() {
            if (!nebulaSprite) {
              var c = document.createElement("canvas");
              c.width = c.height = 320;
              var g2 = c.getContext("2d");
              var grad = g2.createRadialGradient(160, 160, 8, 160, 160, 160);
              grad.addColorStop(0, "rgba(72,124,222,.26)");
              grad.addColorStop(0.42, "rgba(116,96,214,.13)");
              grad.addColorStop(1, "rgba(120,170,220,0)");
              g2.fillStyle = grad;
              g2.beginPath();
              g2.arc(160, 160, 160, 0, Math.PI * 2);
              g2.fill();
              nebulaSprite = c;
            }
            var r = Math.min(W, H) * 0.76 * clamp(cam.zoom, 0.5, 1.6);
            ctx.save();
            ctx.globalAlpha = Math.min(1, easeOut(grow)) * 0.95;
            ctx.drawImage(nebulaSprite, W / 2 - r, H / 2 - r * 0.6, r * 2, r * 1.2);
            ctx.restore();
          }

          /* 星尘：一帧一次批量点绘，几百个点也只画一条路径 */
          function drawDust(proj) {
            ctx.save();
            ctx.fillStyle = "rgba(120,160,210,.55)";
            scene.dust.forEach(function (d, i) {
              var p = project(d);
              if (p.x < -20 || p.y < -20 || p.x > W + 20 || p.y > H + 20) return;
              ctx.globalAlpha =
                (0.3 + 0.6 * clamp((p.z + scene.shell) / (scene.shell * 2), 0, 1)) * Math.min(1, grow * 1.4);
              var r = d.s * Math.max(0.7, p.s * 0.9);
              ctx.beginPath();
              ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
              ctx.fill();
            });
            ctx.restore();
          }

          /* 银河中心：发光核心 */
          function drawHub(nd, p) {
            var r = Math.max(24, nd.r * p.s);
            var spr = sphereSprite(nd.color.main, 64, true);
            var d = r * (spr.box / 64);
            ctx.save();
            ctx.globalAlpha = p.a;
            ctx.drawImage(spr.canvas, p.x - d, p.y - d, d * 2, d * 2);
            ctx.restore();
          }

          /* 鼠标跟随信息条（3D 视图里节点的名字常被排重让位，靠它补足可见性） */
          function drawMouseTip() {
            if (!active || dragging || !pointer.inside || !hoverId) return;
            var node = null;
            scene.nodes.forEach(function (nd) {
              if (nd.id === hoverId) node = nd;
            });
            if (!node) return;
            var col = node.color ? node.color.main : (PALETTE[node.subject] || FALLBACK).main;
            var sub =
              node.kind === "kp"
                ? node.chapter
                  ? node.chapter + " · " + node.subject
                  : node.subject
                : node.kind === "chapter"
                  ? node.subject + " · 章节"
                  : node.kind === "hub"
                    ? "五门专业课总览"
                    : "课程 · " + node.subject;
            var hint =
              node.kind === "kp"
                ? "点击进入知识点详情页"
                : node.kind === "chapter"
                  ? "点击进入该章节详情页"
                  : node.kind === "hub"
                    ? "中心枢纽：连起五门课程"
                    : scene.galaxy || scene.flat
                      ? "点击进入该课程的 3D 知识球"
                      : "点击进入该课程详情页";
            var fs1 = 13.5,
              fs2 = 11.5,
              fs3 = 10.5,
              padX = 13,
              padY = 10,
              gap = 4;
            ctx.save();
            ctx.font = labelFont(fs1, "700");
            var w1 = ctx.measureText(node.label).width;
            ctx.font = labelFont(fs2);
            var w2 = ctx.measureText(sub).width;
            ctx.font = labelFont(fs3);
            var w3 = ctx.measureText(hint).width;
            var bw = Math.max(w1, w2, w3) + padX * 2;
            var bh = padY * 2 + fs1 + fs2 + fs3 + gap * 2 + 2;
            var bx = pointer.x + 18,
              by = pointer.y + 16;
            if (bx + bw > W - 10) bx = pointer.x - bw - 18;
            if (by + bh > H - 10) by = pointer.y - bh - 16;
            ctx.shadowColor = "rgba(0,0,0,.55)";
            ctx.shadowBlur = 20;
            ctx.shadowOffsetY = 6;
            roundRect(ctx, bx, by, bw, bh, 11);
            ctx.fillStyle = "rgba(10,17,30,.97)";
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            /* 深色卡片：用一层浅描边勾清楚边界 */
            ctx.lineWidth = 1.4;
            ctx.strokeStyle = "rgba(255,255,255,.22)";
            ctx.stroke();
            /* 左侧课程色标条 */
            ctx.save();
            roundRect(ctx, bx + 1.2, by + 1.2, 4, bh - 2.4, 2);
            ctx.fillStyle = col;
            ctx.fill();
            ctx.restore();
            /* 指针位置的小亮点 + 一条细引线连到信息条，鼠标在哪一目了然 */
            var anchorX = clamp(pointer.x, bx + 7, bx + bw - 7);
            var anchorY = clamp(pointer.y, by + 7, by + bh - 7);
            ctx.beginPath();
            ctx.moveTo(pointer.x, pointer.y);
            ctx.lineTo(anchorX, anchorY);
            ctx.strokeStyle = "rgba(219,230,246,.5)";
            ctx.lineWidth = 1.1;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(pointer.x, pointer.y, 3.4, 0, Math.PI * 2);
            ctx.fillStyle = "#dbe6f6";
            ctx.fill();
            ctx.lineWidth = 1.4;
            ctx.strokeStyle = "#0a1120";
            ctx.stroke();
            ctx.restore();
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            var tx = bx + padX,
              ty = by + padY;
            ctx.font = labelFont(fs1, "700");
            ctx.fillStyle = "#eaf2ff";
            ctx.fillText(node.label, tx, ty);
            ty += fs1 + gap;
            ctx.font = labelFont(fs2);
            ctx.fillStyle = onDark(col);
            ctx.fillText(sub, tx, ty);
            ty += fs2 + gap;
            ctx.font = labelFont(fs3);
            ctx.fillStyle = "#8fa3bb";
            ctx.fillText(hint, tx, ty);
            ctx.restore();
          }

          /* 标签包围盒 + 重叠判定 */
          function labelBox(text, x, y, font, align) {
            ctx.font = font;
            var w = ctx.measureText(text).width;
            var size = parseFloat(font) || 12;
            var left = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
            return { x: left - 2, y: y - size * 0.7, w: w + 4, h: size * 1.4 };
          }
          function overlaps(a, b) {
            return !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
          }
          function reserve(placed, box, hot) {
            if (!hot) {
              for (var i = 0; i < placed.length; i++) if (overlaps(placed[i], box)) return false;
            }
            placed.push(box);
            return true;
          }

          /* 计划：按优先级（核心 → 课程 → 章节 → 知识点）先给谁铺标签，重叠的让位。
       先算好再画，章节框才知道自己这圈铺不铺得下文字。 */
          function planLabels(proj) {
            if (grow < 0.55 && !hoverId && !state.selectedId) return null; /* 生长动画前半段先不铺 */
            var list = [];
            scene.nodes.forEach(function (nd) {
              list.push({ nd: nd, p: proj[nd.id], hot: nd.id === hoverId || nd.id === state.selectedId });
            });
            var rank = { hub: 0, course: 1, chapter: 2, kp: 3 };
            list.sort(function (a, b) {
              if (rank[a.nd.kind] !== rank[b.nd.kind]) return rank[a.nd.kind] - rank[b.nd.kind];
              return b.p.z - a.p.z;
            });
            var placed = [],
              ids = {};
            /* 画布外的标签直接不画：宁可少一个名字，也不要出现被切掉半行的文字
         （扁视角下最外侧那几个长标签最容易顶出边框） */
            function onCanvas(box) {
              return box.x >= -1 && box.y >= -1 && box.x + box.w <= W + 1 && box.y + box.h <= H + 1;
            }
            list.forEach(function (item) {
              var nd = item.nd,
                p = item.p;
              if (nd.kind === "hub") {
                ids[nd.id] = true;
                hubGeom(nd, p).boxes.forEach(function (b) {
                  placed.push(b);
                });
                return;
              }
              if (nd.kind === "course") {
                ids[nd.id] = true;
                placed.push(courseGeom(nd, p).box);
                return;
              }
              if (nd.kind === "chapter") {
                var box = chapterGeom(nd, p).box;
                if (item.hot) {
                  ids[nd.id] = true;
                  return;
                }
                if (onCanvas(box) && reserve(placed, box, false)) ids[nd.id] = true;
                return;
              }
              if (!item.hot && p.a < 0.28) return; /* 后排太淡的知识点不铺标签 */
              var g = kpGeom(nd, p);
              if (item.hot) {
                ids[nd.id] = true;
                return;
              }
              if (onCanvas(g.box) && reserve(placed, g.box, false)) ids[nd.id] = true;
            });
            return ids;
          }

          /* 三类节点的标签几何：计划与绘制共用，判定框与实际文字永远一致 */
          function kpGeom(nd, p) {
            var r = Math.max(3.4, nd.r * p.s);
            /* 标签沿「从中心向外」的方向摆放，不会全挤在一侧 */
            var ux = p.x - W / 2,
              uy = p.y - H / 2;
            var ul = Math.sqrt(ux * ux + uy * uy) || 1;
            ux /= ul;
            uy /= ul;
            var font = labelFont(clamp(11.6 * p.s, 10, 15));
            var align = ux >= 0 ? "left" : "right";
            var lx = p.x + ux * (r + 6),
              ly = p.y + uy * (r + 6) + 1;
            return {
              r: r,
              font: font,
              align: align,
              lx: lx,
              ly: ly,
              box: labelBox(nd.label, lx, ly, font, align),
            };
          }
          function chapterGeom(nd, p) {
            var fs = clamp(13.4 * p.s, 11, 18);
            var font = labelFont(fs, "600");
            return {
              fs: fs,
              font: font,
              lx: p.x,
              ly: p.y + 0.5,
              box: labelBox(nd.label, p.x, p.y + 0.5, font, "center"),
            };
          }
          function courseGeom(nd, p) {
            var r = Math.max(26, nd.r * p.s);
            var font = labelFont(clamp(14.5 * p.s, 12, 20), "700");
            var ly = p.y + r + 16;
            return { r: r, font: font, ly: ly, box: labelBox(nd.label, p.x, ly, font, "center") };
          }
          function hubGeom(nd, p) {
            var r = Math.max(24, nd.r * p.s);
            var words = String(nd.label || "");
            var lines = words.length > 6 ? [words.slice(0, 6), words.slice(6)] : [words];
            var font = labelFont(clamp(14 * p.s, 12, 19), "700");
            var top = p.y + r + 15;
            var boxes = lines.map(function (line, i) {
              return labelBox(line, p.x, top + i * 19, font, "center");
            });
            return { r: r, lines: lines, font: font, top: top, boxes: boxes };
          }

          function drawLabels(proj, active_id, plan) {
            if (!plan) return;
            var list = [];
            scene.nodes.forEach(function (nd) {
              if (!plan[nd.id]) return;
              list.push({ nd: nd, p: proj[nd.id], hot: nd.id === hoverId || nd.id === state.selectedId });
            });
            var rank = { hub: 0, course: 1, chapter: 2, kp: 3 };
            list.sort(function (a, b) {
              if (rank[a.nd.kind] !== rank[b.nd.kind]) return rank[a.nd.kind] - rank[b.nd.kind];
              return b.p.z - a.p.z;
            });
            list.forEach(function (item) {
              var nd = item.nd,
                p = item.p;
              if (nd.kind === "hub") drawHubLabel(nd, p);
              else if (nd.kind === "course") drawCourseLabel(nd, p, nd.id === active_id);
              else if (nd.kind === "chapter") drawChapterLabel(nd, p, item.hot);
              else drawKpLabel(nd, p, item.hot);
            });
          }

          /* 银河中心的标题：两行、始终铺在最上面 */
          function drawHubLabel(nd, p) {
            var g = hubGeom(nd, p);
            ctx.save();
            ctx.globalAlpha = Math.min(1, p.a + 0.3);
            ctx.font = g.font;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.lineWidth = 3.6;
            ctx.strokeStyle = HALO_DARK;
            g.lines.forEach(function (line, i) {
              var y = g.top + i * 19;
              ctx.strokeText(line, p.x, y);
              ctx.fillStyle = "#eaf2ff";
              ctx.fillText(line, p.x, y);
            });
            ctx.restore();
          }

          function drawCourseLabel(nd, p, hot) {
            var g = courseGeom(nd, p);
            ctx.save();
            ctx.globalAlpha = Math.min(1, p.a + 0.2);
            ctx.font = g.font;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.lineWidth = 3.6;
            ctx.strokeStyle = HALO_DARK;
            ctx.strokeText(nd.label, p.x, g.ly);
            ctx.fillStyle = onDark(hot ? frameAccent : nd.color.main);
            ctx.fillText(nd.label, p.x, g.ly);
            ctx.restore();
          }

          function drawChapterLabel(nd, p, hot) {
            var g = chapterGeom(nd, p);
            ctx.save();
            ctx.globalAlpha = Math.min(1, p.a + 0.16);
            ctx.font = g.font;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.lineWidth = 3;
            ctx.strokeStyle = HALO_DARK;
            ctx.strokeText(nd.label, g.lx, g.ly);
            ctx.fillStyle = onDark(hot ? frameAccent : nd.color.main);
            ctx.fillText(nd.label, g.lx, g.ly);
            ctx.restore();
          }

          function drawKpLabel(nd, p, hot) {
            var g = kpGeom(nd, p);
            ctx.save();
            /* 后排节点的标签原本会淡到看不清，这里给一个透明度下限 */
            ctx.globalAlpha = Math.min(1, Math.max(0.72, p.a + 0.26));
            ctx.font = g.font;
            ctx.textAlign = g.align;
            ctx.textBaseline = "middle";
            /* 知识点标签数量最多（全量 105 个），深色底上不再描边：
         strokeText 的栅格化开销是 fillText 的好几倍，去掉后全量图帧时间从 19ms 回到 60fps。 */
            ctx.fillStyle = onDark(hot ? frameAccent : (PALETTE[nd.subject] || FALLBACK).main);
            ctx.fillText(nd.label, g.lx, g.ly);
            ctx.restore();
          }

          function drawShell(it) {
            ctx.save();
            var front = it.z >= 0;
            ctx.beginPath();
            it.pts.forEach(function (p, i) {
              if (i) ctx.lineTo(p.x, p.y);
              else ctx.moveTo(p.x, p.y);
            });
            if (scene.galaxy) {
              ctx.strokeStyle = "rgba(120,160,210,.20)"; /* 银河盘面上的轨道环 */
              ctx.lineWidth = 1;
            } else {
              ctx.strokeStyle = rgba(scene.course.color.main, front ? 0.3 : 0.13);
              ctx.lineWidth = front ? 1.2 : 1;
            }
            ctx.stroke();
            ctx.restore();
          }

          function drawEdge(it) {
            ctx.save();
            ctx.globalAlpha =
              it.alpha *
              (0.55 + 0.45 * clamp(((it.a.z + it.b.z) / 2 + scene.shell) / (scene.shell * 2), 0, 1));
            ctx.strokeStyle = it.color;
            ctx.lineWidth = it.width;
            if (it.dash && it.dash.length) ctx.setLineDash(it.dash);
            ctx.beginPath();
            ctx.moveTo(it.a.x, it.a.y);
            if (it.bend)
              ctx.quadraticCurveTo(
                (it.a.x + it.b.x) / 2 + it.bend.x,
                (it.a.y + it.b.y) / 2 + it.bend.y,
                it.b.x,
                it.b.y,
              );
            else ctx.lineTo(it.b.x, it.b.y);
            ctx.stroke();
            ctx.restore();
          }

          function labelFont(size, weight) {
            return (
              (weight ? weight + " " : "") +
              size.toFixed(1) +
              'px "Microsoft YaHei", "PingFang SC", system-ui, sans-serif'
            );
          }

          function drawKp(nd, p) {
            var r = Math.max(3.4, nd.r * p.s);
            var col = (PALETTE[nd.subject] || FALLBACK).main;
            var hot = nd.id === hoverId || nd.id === state.selectedId;
            /* 单课知识球里的小圆点用「亮丽版」精灵：颜色更透亮（总览保持原来的沉稳配色） */
            var spr = sphereSprite(col, 16, false, Boolean(scene.course));
            var d = r * (spr.box / 16);
            ctx.save();
            /* 后排小圆点别淡到看不见：深色底上给一个透明度下限，颜色才立得住 */
            ctx.globalAlpha = Math.max(0.72, p.a);
            ctx.drawImage(spr.canvas, p.x - d, p.y - d, d * 2, d * 2);
            if (hot) {
              ctx.beginPath();
              ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
              ctx.strokeStyle = frameAccent;
              ctx.lineWidth = 2;
              ctx.stroke();
            }
            drawPulse(nd, p, r);
            ctx.restore();
          }

          function drawChapter(nd, p, withLabel) {
            var hot = nd.id === hoverId || nd.id === state.selectedId;
            var fs = clamp(13.4 * p.s, 11, 18);
            ctx.save();
            ctx.globalAlpha = Math.max(0.66, p.a);
            ctx.font = labelFont(fs, "600");
            var tw = ctx.measureText(nd.label).width;
            /* 铺不下文字（被别的标签占了位）时收成一个小方块，不再顶着一整条空框去压别人 */
            var w = withLabel ? tw + 26 * clamp(p.s, 0.72, 1.5) : Math.max(12, 16 * p.s);
            var h = withLabel ? clamp(27 * p.s, 20, 38) : Math.max(12, 16 * p.s);
            roundRect(ctx, p.x - w / 2, p.y - h / 2, w, h, Math.min(9, h / 2));
            /* 夜间章节框：深色玻璃底 + 课程色发光描边（2D 版仍是浅色小卡片，各自贴合底色） */
            ctx.fillStyle = withLabel ? "rgba(10,17,30,.86)" : rgba(nd.color.main, 0.22);
            ctx.fill();
            ctx.lineWidth = hot ? 2.4 : 1.3;
            ctx.strokeStyle = hot ? frameAccent : rgba(nd.color.main, 0.92);
            ctx.stroke();
            /* 章节框也勾一圈淡淡的白边（比课程球暗），小框在夜里更好认 */
            if (!hot) {
              ctx.lineWidth = 1;
              ctx.strokeStyle = "rgba(233,241,255,.22)";
              roundRect(
                ctx,
                p.x - w / 2 - 1.4,
                p.y - h / 2 - 1.4,
                w + 2.8,
                h + 2.8,
                Math.min(10, h / 2 + 1.4),
              );
              ctx.stroke();
            }
            drawPulse(nd, p, Math.max(w, h) / 2);
            ctx.restore();
          }

          function drawCourse(nd, p, active_id) {
            var hot = nd.id === active_id;
            var r = Math.max(26, nd.r * p.s);
            var spr = sphereSprite(nd.color.main, 64, true); /* 光晕烘进精灵，省掉每帧 shadowBlur */
            var d = r * (spr.box / 64);
            ctx.save();
            ctx.globalAlpha = Math.max(0.78, p.a);
            ctx.drawImage(spr.canvas, p.x - d, p.y - d, d * 2, d * 2);
            ctx.fillStyle = "#fff";
            ctx.font = labelFont(clamp(19 * p.s, 15, 26), "700");
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(nd.color.abbr, p.x, p.y + 1);
            if (hot) {
              ctx.beginPath();
              ctx.arc(p.x, p.y, r + 7, 0, Math.PI * 2);
              ctx.strokeStyle = frameAccent;
              ctx.lineWidth = 2.2;
              ctx.stroke();
            }
            ctx.restore();
          }

          /* 搜索定位：在 3D 里给命中节点套一圈脉冲 */
          function drawPulse(nd, p, r) {
            if (pulseId !== nd.id) return;
            var t = (performance.now() - pulseAt) / 2400;
            if (t < 0 || t > 1) return;
            ctx.save();
            ctx.globalAlpha = (1 - t) * 0.9;
            ctx.strokeStyle = "#ffc247";
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r + 6 + t * 34, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            if (t < 1) {
              /* 继续动画由主循环驱动 */
            } else pulseId = null;
          }

          /* ---------- 命中测试（屏幕空间最近且最靠前的节点） ---------- */
          /* ---------- 命中测试：重叠时优先「小目标」（知识点 > 章节 > 课程 > 核心）——
       银河里知识点就贴在章节框旁边，若只按深度取最近的，知识点永远点不到 ---------- */
          function hit(x, y) {
            if (!scene) return null;
            syncTrig();
            var rank = { kp: 0, chapter: 1, course: 2, hub: 3 };
            var best = null;
            scene.nodes.forEach(function (nd) {
              var p = project(nd);
              var r;
              if (nd.kind === "kp") r = Math.max(9, nd.r * p.s + 5);
              else if (nd.kind === "chapter")
                r = Math.max(24, (textWidth(nd.label, clamp(13.4 * p.s, 11, 18)) + 34) / 2);
              else r = Math.max(26, nd.r * p.s + 6);
              var dx = x - p.x,
                dy = y - p.y;
              if (dx * dx + dy * dy > r * r) return;
              if (!best) {
                best = { node: nd, z: p.z };
                return;
              }
              var a = rank[nd.kind] === undefined ? 3 : rank[nd.kind];
              var b = rank[best.node.kind] === undefined ? 3 : rank[best.node.kind];
              if (a < b || (a === b && p.z > best.z)) best = { node: nd, z: p.z };
            });
            return best ? best.node : null;
          }

          /* ---------- 相机 / 状态 ---------- */
          function nearestYaw(target) {
            var d = target - cam.yaw;
            return cam.yaw + d - Math.round(d / (Math.PI * 2)) * Math.PI * 2;
          }
          function homeOf() {
            if (scene && scene.flat) return HOME_FLAT;
            return scene && scene.galaxy ? HOME_GALAXY : HOME;
          }
          function resetCamera() {
            var home = homeOf();
            camTarget = { yaw: nearestYaw(home.yaw), pitch: home.pitch, zoom: home.zoom };
          }
          function resize() {
            var w = mainEl.clientWidth,
              h = mainEl.clientHeight;
            /* 分辨率 = min(设备像素比, 画质上限, 像素预算允许的倍数)：
         4K/高分屏把窗口拉大时，画布不会跟着无限变大，帧率才稳得住 */
            var byBudget = Math.sqrt(PIXEL_BUDGET / Math.max(w * h, 1));
            DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, qualityCap, byBudget));
            var pw = Math.max(1, Math.round(w * DPR)),
              ph = Math.max(1, Math.round(h * DPR));
            /* 尺寸没变就不要重新分配画布缓冲（重建后备存储是一次不小的开销） */
            if (W === w && H === h && cvs.width === pw && cvs.height === ph) return;
            W = w;
            H = h;
            cvs.width = pw;
            cvs.height = ph;
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          }

          /* 自适应取景：整颗「知识球」按画布大小自动缩放，节点多（数据结构 82 个）也不会溢出画布 */
          function fitCamera() {
            if (!scene || !W || !H) return;
            syncTrig();
            var keepGrow = grow;
            grow = 1;

            /* 银河是会自转的盘：只按当前角度取景，转到别的角度时近端旋臂会被透视放大、冲出画面。
         这里在 8 个偏航角上各投影一遍，按「最坏角度」的包围盒取景，一圈转下来都不会出框。 */
            if (scene.galaxy) {
              var keepZoom = cam.zoom,
                keepYaw = cam.yaw;
              cam.zoom = 1;
              var spanX = 1,
                spanY = 1;
              for (var k = 0; k < 8; k++) {
                cam.yaw = (k / 8) * Math.PI * 2;
                syncTrig();
                scene.nodes.forEach(function (nd) {
                  var p = project(nd);
                  spanX = Math.max(spanX, Math.abs(p.x - W / 2) + 34);
                  spanY = Math.max(spanY, Math.abs(p.y - H / 2) + 34);
                });
              }
              cam.yaw = keepYaw;
              cam.zoom = keepZoom;
              syncTrig();
              grow = keepGrow;
              cam.zoom = clamp(Math.min((W * 0.94) / (2 * spanX), (H * 0.92) / (2 * spanY)), 0.3, 1.5);
              return;
            }

            var minX = 1e9,
              maxX = -1e9,
              minY = 1e9,
              maxY = -1e9;
            var zoom = cam.zoom || 1;
            /* 留白要够放标签：知识点 / 章节的名字是挂在节点外侧的，只按节点半径留 36px
         会在扁视角（横向成为限制边）时把最外侧的文字切掉半行。这里按标签长度给余量，
         仍然放不下的个别长标签由 planLabels 在画布外裁掉，绝不出现半截文字。 */
            scene.nodes.forEach(function (nd) {
              var p = project(nd);
              var r = nd.kind === "hub" ? 118 : nd.kind === "course" ? 96 : nd.kind === "chapter" ? 92 : 76;
              var dx = (p.x - W / 2) / zoom,
                dy = (p.y - H / 2) / zoom;
              if (dx - r < minX) minX = dx - r;
              if (dx + r > maxX) maxX = dx + r;
              if (dy - r < minY) minY = dy - r;
              if (dy + r > maxY) maxY = dy + r;
            });
            grow = keepGrow;
            var zx = (W * 0.94) / Math.max(maxX - minX, 1);
            var zy = (H * 0.92) / Math.max(maxY - minY, 1);
            cam.zoom = clamp(Math.min(zx, zy), 0.45, 1.5);
          }

          function crumbText() {
            if (scene.flat) {
              var fchs = 0,
                fkps = 0;
              scene.nodes.forEach(function (nd) {
                if (nd.kind === "chapter") fchs++;
                else if (nd.kind === "kp") fkps++;
              });
              if (scene.collapsed) {
                return (
                  "3D 视角（平面盘） · 全部章节已折叠（只留 " +
                  courses.length +
                  " 门课程，点「展开全部章节」恢复）"
                );
              }
              if (mode === "cross") {
                return (
                  "3D 视角（平面盘） · 只看跨课程关系 · " +
                  courses.length +
                  " 门课程 · " +
                  fchs +
                  " 个章节 · " +
                  fkps +
                  " 个知识点 · 与平面版逐点同一布局（自动缓慢旋转 / 拖拽转动 / 滚轮缩放 / 双击复位；点「展开全部章节」看全部）"
                );
              }
              return (
                "3D 视角（平面盘） · " +
                courses.length +
                " 门课程 · " +
                fchs +
                " 个章节 · " +
                fkps +
                " 个知识点 · 与平面版逐点同一布局（自动缓慢旋转 / 拖拽转动 / 滚轮缩放 / 双击复位，点课程球进入该课程的 3D 知识球）"
              );
            }
            if (scene.galaxy) {
              var gchs = 0,
                gkps = 0;
              scene.nodes.forEach(function (nd) {
                if (nd.kind === "chapter") gchs++;
                else if (nd.kind === "kp") gkps++;
              });
              if (scene.collapsed) {
                return (
                  "银河视图 · 全部章节已折叠（只留 " +
                  courses.length +
                  " 门课程核与中心核心，点「展开全部章节」恢复）"
                );
              }
              if (mode === "cross") {
                return "银河视图 · 只看跨课程关系（" + CROSS_COUNT + " 条关联 · 已按关联裁剪节点）";
              }
              return (
                "银河视图 · " +
                courses.length +
                " 门课程 · " +
                gchs +
                " 个章节 · " +
                gkps +
                " 个知识点（自动旋转 / 拖拽转动 / 滚轮缩放 / 双击复位，点课程核进入该课程的 3D 知识球）"
              );
            }
            var chs = 0,
              kps = 0;
            scene.nodes.forEach(function (nd) {
              if (nd.kind === "chapter") chs++;
              else if (nd.kind === "kp") kps++;
            });
            var total = scene.course.chapters.reduce(function (s, ch) {
              return s + ch.kps.length;
            }, 0);
            if (scene.collapsed) {
              return (
                "三维知识网络 · " +
                scene.course.label +
                " · 全部章节已折叠（" +
                scene.course.chapters.length +
                " 个章节 · " +
                total +
                " 个知识点，点「展开全部章节」恢复）"
              );
            }
            return (
              "三维知识网络 · " +
              scene.course.label +
              " · " +
              chs +
              " 个章节 · " +
              kps +
              " 个知识点（拖拽旋转 / 滚轮缩放 / 双击复位，右上角可切换课程）"
            );
          }

          /* 场景构建：总览 → 银河；单课 → 知识球。同时预热用到的球体精灵 */
          function rebuild() {
            if (state.focusSubject) {
              var c = courseBySubject[state.focusSubject];
              build(c, mode !== "collapse");
              sphereSprite(c.color.main, 64, true);
              var warmed = {};
              c.chapters.forEach(function (ch) {
                ch.kps.forEach(function (kp) {
                  if (warmed[kp.subject]) return;
                  warmed[kp.subject] = 1;
                  sphereSprite((PALETTE[kp.subject] || FALLBACK).main, 16, false);
                });
              });
              return;
            }
            buildFlat3D(mode !== "collapse");
            sphereSprite("#086fe7", 64, true);
            courses.forEach(function (c) {
              sphereSprite(c.color.main, 64, true);
              sphereSprite(c.color.main, 16, false);
            });
          }

          function enter() {
            rebuild();
            active = true;
            resize();
            var home = homeOf();
            cam.yaw = home.yaw;
            cam.pitch = home.pitch;
            camTarget = null;
            fitCamera();
            last = 0;
            mainEl.classList.add("is-3d");
            document.getElementById("crumb").textContent = crumbText();
            if (!raf) raf = requestAnimationFrame(loop);
          }

          function exit() {
            active = false;
            if (raf) {
              cancelAnimationFrame(raf);
              raf = 0;
            }
            mainEl.classList.remove("is-3d");
            hoverId = null;
            pulseId = null;
          }

          /* render() 每次都会调用：负责 2D / 3D 切换、场景切换、以及同一场景内的展开 / 折叠 */
          function sync() {
            var want3d = Boolean(state.focusSubject) || view3dOn;
            if (!want3d) {
              if (active) exit();
              return;
            }
            if (!active) {
              enter();
              return;
            }
            var key = state.focusSubject ? "course:" + state.focusSubject : "galaxy";
            var wantCollapse = mode === "collapse";
            /* 场景、展开状态、或「只看跨课程关系」这类视图模式变化时都要重建 */
            if (!scene || scene.key !== key || scene.collapsed !== wantCollapse || scene.mode !== mode) {
              var changed = !scene || scene.key !== key;
              rebuild();
              /* 换场景时回到该场景的默认视角；只在同一场景里折叠 / 展开则保留当前视角 */
              if (changed) {
                var home = homeOf();
                cam.yaw = home.yaw;
                cam.pitch = home.pitch;
                camTarget = null;
                fitCamera();
              }
            }
            document.getElementById("crumb").textContent = crumbText();
          }

          function focusKp(id) {
            if (!scene) return;
            var node = null;
            scene.nodes.forEach(function (nd) {
              if (nd.id === id) node = nd;
            });
            if (!node) return;
            state.selectedId = id;
            pulseId = id;
            pulseAt = performance.now();
            /* 银河是盘状：镜头压低一点、拉近一点，命中的节点转到正前方 */
            camTarget = scene.galaxy
              ? { yaw: nearestYaw(-Math.atan2(node.x, node.z)), pitch: 0.42, zoom: 1.6 }
              : { yaw: nearestYaw(-Math.atan2(node.x, node.z)), pitch: 0.22, zoom: 1.45 };
          }

          /* ---------- 事件 ---------- */
          function localPoint(event) {
            var rect = cvs.getBoundingClientRect();
            return { x: event.clientX - rect.left, y: event.clientY - rect.top };
          }
          cvs.addEventListener("mousedown", function (event) {
            if (!active) return;
            dragging = true;
            moved = 0;
            lastX = event.clientX;
            lastY = event.clientY;
            camTarget = null;
            cvs.classList.add("is-grabbing");
            cvs.classList.remove("is-hover-node");
          });
          window.addEventListener("mousemove", function (event) {
            if (!active) return;
            var pt = localPoint(event);
            if (dragging) {
              var dx = event.clientX - lastX,
                dy = event.clientY - lastY;
              lastX = event.clientX;
              lastY = event.clientY;
              moved += Math.abs(dx) + Math.abs(dy);
              cam.yaw += dx * 0.0062;
              cam.pitch = clamp(cam.pitch + dy * 0.0045, -1.45, 1.45);
              return;
            }
            if (pt.x < 0 || pt.y < 0 || pt.x > W || pt.y > H) return;
            pointer.x = pt.x;
            pointer.y = pt.y;
            pointer.inside = true;
            var node = hit(pt.x, pt.y);
            var id = node ? node.id : null;
            if (id !== hoverId) {
              hoverId = id;
              cvs.classList.toggle("is-hover-node", Boolean(id));
            }
          });
          window.addEventListener("mouseup", function () {
            if (!active || !dragging) return;
            dragging = false;
            cvs.classList.remove("is-grabbing");
            if (hoverId) cvs.classList.add("is-hover-node");
            holdSpinUntil = performance.now() + 3000; /* 拖完停 3 秒再继续自转 */
          });
          cvs.addEventListener("click", function (event) {
            if (!active) return;
            if (moved > 6) {
              moved = 0;
              return;
            }
            var pt = localPoint(event);
            var node = hit(pt.x, pt.y);
            if (!node || node.kind === "hub") return; /* 银河中心只作装饰 */
            /* 总览的 3D 视角（平面盘 / 银河）里点课程核 = 进入这门课的 3D 知识球；
         单课知识球里点球心课程 = 该课程详情页 */
            if (node.kind === "course" && (scene.galaxy || scene.flat)) {
              pickCourse(node.subject);
              return;
            }
            gotoDetailPage(node);
          });
          cvs.addEventListener("dblclick", function () {
            if (active) resetCamera();
          });
          cvs.addEventListener(
            "wheel",
            function (event) {
              if (!active) return;
              event.preventDefault();
              cam.zoom = clamp(cam.zoom * Math.exp(-event.deltaY * 0.0011), 0.45, 3.2);
              camTarget = null;
            },
            { passive: false },
          );
          cvs.addEventListener("mouseleave", function () {
            pointer.inside = false;
            if (hoverId) {
              hoverId = null;
              cvs.classList.remove("is-hover-node");
            }
          });

          /* 触摸：单指旋转、双指捏合缩放 */
          var touchDist = 0;
          cvs.addEventListener(
            "touchstart",
            function (event) {
              if (!active) return;
              camTarget = null;
              if (event.touches.length === 1) {
                lastX = event.touches[0].clientX;
                lastY = event.touches[0].clientY;
              } else if (event.touches.length === 2) {
                touchDist = Math.hypot(
                  event.touches[0].clientX - event.touches[1].clientX,
                  event.touches[0].clientY - event.touches[1].clientY,
                );
              }
            },
            { passive: true },
          );
          cvs.addEventListener(
            "touchmove",
            function (event) {
              if (!active) return;
              if (event.touches.length === 1) {
                var dx = event.touches[0].clientX - lastX,
                  dy = event.touches[0].clientY - lastY;
                lastX = event.touches[0].clientX;
                lastY = event.touches[0].clientY;
                cam.yaw += dx * 0.0062;
                cam.pitch = clamp(cam.pitch + dy * 0.0045, -1.45, 1.45);
                event.preventDefault();
              } else if (event.touches.length === 2) {
                var d = Math.hypot(
                  event.touches[0].clientX - event.touches[1].clientX,
                  event.touches[0].clientY - event.touches[1].clientY,
                );
                if (touchDist) cam.zoom = clamp(cam.zoom * (d / touchDist), 0.45, 3.2);
                touchDist = d;
                event.preventDefault();
              }
            },
            { passive: false },
          );
          window.addEventListener("resize", function () {
            if (active) resize();
          });

          /* ---------- 主循环 ---------- */
          function loop(ts) {
            if (!active) return;
            if (!last) last = ts;
            /* 锁帧档：真机太弱时按固定 30fps 出帧，比忽快忽慢更顺 */
            if (minFrameMs && ts - last < minFrameMs) {
              raf = requestAnimationFrame(loop);
              return;
            }
            var dt = Math.min((ts - last) / 1000, 0.05);
            last = ts;
            if (camTarget) {
              var k = 1 - Math.pow(0.002, dt);
              cam.yaw += (camTarget.yaw - cam.yaw) * k;
              cam.pitch += (camTarget.pitch - cam.pitch) * k;
              cam.zoom += (camTarget.zoom - cam.zoom) * k;
              if (
                Math.abs(camTarget.yaw - cam.yaw) < 0.002 &&
                Math.abs(camTarget.pitch - cam.pitch) < 0.002 &&
                Math.abs(camTarget.zoom - cam.zoom) < 0.002
              ) {
                cam.yaw = camTarget.yaw;
                cam.pitch = camTarget.pitch;
                cam.zoom = camTarget.zoom;
                camTarget = null;
              }
            } else if (SPIN && !dragging && !hoverId && !reduceMotion && ts > holdSpinUntil) {
              cam.yaw += SPIN * dt; /* 缓慢自转（0.07 rad/s ≈ 90 秒一圈） */
            }
            if (grow < 1) grow = Math.min(1, grow + dt / 0.72);
            var drawStart = performance.now();
            draw();
            drawMs = drawMs
              ? drawMs * 0.9 + (performance.now() - drawStart) * 0.1
              : performance.now() - drawStart;
            frameCount++;
            /* 自适应画质：连续掉帧依次降级 1.25 → 1 倍分辨率，仍不行就锁 30fps；
         稳定一阵（连续 150 帧都在预算内）再逐步恢复，避免降级之后再也好不回来。 */
            if (dt > 0.026) {
              slowFrames++;
              fastFrames = 0;
            } else {
              if (slowFrames > 0) slowFrames--;
              fastFrames++;
            }
            if (slowFrames > 10 && qualityCap > 1.25) {
              qualityCap = 1.25;
              sprites = {};
              resize();
              slowFrames = 0;
              fastFrames = 0;
            } else if (slowFrames > 20 && qualityCap > 1) {
              qualityCap = 1;
              sprites = {};
              resize();
              slowFrames = 0;
              fastFrames = 0;
            } else if (slowFrames > 32 && !minFrameMs) {
              minFrameMs = 32; /* 临时稳 30fps：比忽快忽慢看着顺 */
              slowFrames = 0;
              fastFrames = 0;
            } else if (fastFrames > 150 && minFrameMs) {
              minFrameMs = 0; /* 缓过来了：解锁回正常帧率 */
              fastFrames = 0;
            } else if (fastFrames > 300 && qualityCap < qualityCapMax) {
              qualityCap = qualityCap === 1 ? 1.25 : 1.5; /* 再往上补一档分辨率 */
              sprites = {};
              resize();
              fastFrames = 0;
            }
            raf = requestAnimationFrame(loop);
          }

          /* 自动化测试可用的探针 */
          window.__KG3D__ = {
            active: function () {
              return active;
            },
            info: function () {
              if (!scene) return null;
              var kinds = { hub: 0, course: 0, chapter: 0, kp: 0 };
              scene.nodes.forEach(function (nd) {
                kinds[nd.kind]++;
              });
              return {
                scene: scene.key,
                galaxy: Boolean(scene.galaxy),
                subject: scene.course ? scene.course.subject : null,
                nodes: scene.nodes.length,
                kinds: kinds,
                links: scene.links.length,
                rels: scene.rels.length,
                yaw: cam.yaw,
                pitch: cam.pitch,
                zoom: cam.zoom,
                grow: grow,
                dpr: DPR,
                drawMs: +drawMs.toFixed(2),
                cap: qualityCap,
                lock: minFrameMs,
                slow: slowFrames,
                fast: fastFrames,
                backdrop: backdropKey,
                hover: hoverId,
                selected: state.selectedId,
                w: W,
                h: H,
              };
            },
            screen: function (id) {
              if (!scene) return null;
              var out = null;
              scene.nodes.forEach(function (nd) {
                if (nd.id === id) {
                  var p = project(nd);
                  out = { x: p.x, y: p.y, r: nd.r * p.s, z: p.z };
                }
              });
              return out;
            },
            pick: function (x, y) {
              var nd = hit(x, y);
              return nd ? nd.id : null;
            },
            ids: function () {
              return scene
                ? scene.nodes.map(function (nd) {
                    return nd.id;
                  })
                : [];
            },
            model: function (id) {
              if (!scene) return null;
              var out = null;
              scene.nodes.forEach(function (nd) {
                if (nd.id === id) out = { x: nd.x, y: nd.y, z: nd.z, kind: nd.kind };
              });
              return out;
            },
            cam: function () {
              return { yaw: cam.yaw, pitch: cam.pitch, zoom: cam.zoom };
            },
            frames: function () {
              return frameCount;
            },
          };

          return {
            sync: sync,
            isActive: function () {
              return active;
            },
            resetCamera: resetCamera,
            focusKp: focusKp,
            exit: exit,
          };
        })();

        /* -------------------------------------------------------------------------
     8. 工具栏 + 右上角课程选择（单课居中放射）
     ------------------------------------------------------------------------- */
        var picker = document.getElementById("coursePicker");
        var pickerBtn = document.getElementById("btnCourse");
        var pickerLabel = document.getElementById("coursePickLabel");
        var courseMenu = document.getElementById("courseMenu");

        function buildCourseMenu() {
          var html =
            '<button type="button" data-subject=""><i style="background:#5b7186"></i>全部课程<em>总览</em></button>';
          courses.forEach(function (c) {
            var kpCount = c.chapters.reduce(function (s, ch) {
              return s + ch.kps.length;
            }, 0);
            html +=
              '<button type="button" data-subject="' +
              c.subject +
              '">' +
              '<i style="background:' +
              c.color.main +
              '"></i>' +
              c.subject +
              "<em>" +
              c.chapters.length +
              " 章 · " +
              kpCount +
              " 知识点</em></button>";
          });
          html += '<div class="course-menu__hint">选择课程后，图谱会以该课程为中心重新展开</div>';
          courseMenu.innerHTML = html;
          Array.prototype.forEach.call(courseMenu.querySelectorAll("button[data-subject]"), function (btn) {
            btn.addEventListener("click", function () {
              pickCourse(btn.getAttribute("data-subject"));
            });
          });
        }

        function closeCourseMenu() {
          picker.classList.remove("is-open");
          pickerBtn.setAttribute("aria-expanded", "false");
        }

        /* 回总览时把进单课前用的模式（默认那版「只看跨课程关系」）恢复回来 */
        function restoreOverviewMode() {
          if (!overviewMode) return;
          mode = overviewMode;
          overviewMode = null;
        }

        function pickCourse(subject) {
          state.focusSubject = subject || "";
          state.selectedId = null;
          state.hoverId = null;
          /* 「只看跨课程关系」「折叠全部章节」都是总览态；进单课 3D 时一律展开，
       否则点课程圆进去只看到一个空壳，像是没反应。
       总览用的模式先记下来，回到总览时恢复（默认那版「只看跨课程关系」不该被悄悄改掉）。 */
          if (state.focusSubject) {
            if (mode !== "all") {
              overviewMode = mode;
              mode = "all";
            }
          } else if (overviewMode) {
            restoreOverviewMode();
          }
          closeCourseMenu();
          /* 切课：布局放慢到 900ms，新节点从圆心淡入展开（"慢慢呈现出来"）；
       自适应缩放用 760ms 平滑跟进，避免整幅图硬跳。
       进 3D 单课视图时 2D 图层隐藏，这两步都交给 3D 自己做（生长动画 + 自动取景）。 */
          render(true, 900);
          if (!state.focusSubject) fitView(760);
        }

        pickerBtn.addEventListener("click", function (event) {
          event.stopPropagation();
          var open = picker.classList.toggle("is-open");
          pickerBtn.setAttribute("aria-expanded", open ? "true" : "false");
        });
        document.addEventListener("click", function (event) {
          if (!event.target.closest || !event.target.closest("#coursePicker")) closeCourseMenu();
        });
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") closeCourseMenu();
        });
        buildCourseMenu();

        function updateCrumb() {
          var crumb = document.getElementById("crumb");
          if (state.focusSubject) {
            var c = courseBySubject[state.focusSubject];
            var kpCount = c.chapters.reduce(function (s, ch) {
              return s + ch.kps.length;
            }, 0);
            crumb.textContent =
              "聚焦课程：" +
              state.focusSubject +
              " · " +
              c.chapters.length +
              " 个章节 · " +
              kpCount +
              " 个知识点（右上角可切换课程）";
            return;
          }
          if (view3dOn) return; /* 3D 视角的面包屑由 3D 引擎自己写 */
          if (mode === "collapse")
            crumb.textContent = "折叠视图：只保留 5 门主课程节点（点课程圆进入 3D 立体网络）";
          else if (mode === "cross")
            crumb.textContent = "只看跨课程关系：课程 + 跨课程相关知识点（" + CROSS_COUNT + " 条关联）";
          else
            crumb.textContent =
              "总览：5 门核心课程 · " +
              TOTAL_CHAPTERS +
              " 个章节 · " +
              kpNodes.length +
              " 个知识点（点击课程圆 → 该课程的 3D 立体网络）";
        }

        function syncButtons() {
          document.getElementById("btnCrossOnly").classList.toggle("is-on", mode === "cross");
          document.getElementById("btnGalaxy").classList.toggle("is-on", view3dOn);
          document.getElementById("btnGalaxy").textContent = view3dOn ? "平面视角" : "3D 视角";
          /* 3D 视图里这两个键同样生效，状态也要如实显示（否则像是按了没反应） */
          document.getElementById("btnExpand").classList.toggle("is-on", mode === "all");
          document.getElementById("btnCollapse").classList.toggle("is-on", mode === "collapse");
          svg.classed("is-crossonly", mode === "cross");

          /* 右上角选择器：显示当前课程，菜单里高亮对应项（用课程自己的颜色） */
          var current = state.focusSubject ? courseBySubject[state.focusSubject] : null;
          pickerLabel.textContent = current ? current.subject : "全部课程";
          picker.classList.toggle("is-on", Boolean(current));
          picker.style.setProperty("--kg-course", current ? current.color.main : "");
          picker.style.setProperty("--kg-course-tint", current ? tintA(current.color.main, 0.18) : "");
          Array.prototype.forEach.call(courseMenu.querySelectorAll("button[data-subject]"), function (btn) {
            var subject = btn.getAttribute("data-subject") || "";
            var on = subject === (state.focusSubject || "");
            btn.classList.toggle("is-on", on);
            var c = subject ? courseBySubject[subject] : null;
            btn.style.background = on ? (c ? c.color.tint : "#eef2f6") : "";
            btn.style.color = on ? (c ? c.color.main : "#47607a") : "";
          });
        }

        function setMode(next) {
          mode = next;
          /* 手动点了工具栏：以用户这次选择为准，进单课前记下的模式作废 */
          overviewMode = null;
          state.selectedId = null;
          render(true);
          fitView(0); /* 与布局动画同时改缩放最费性能，改成瞬时到位 */
        }

        /* 「3D 视角 / 平面视角」开关：同一张放射图，在平面 SVG 与倾斜的 3D 盘面之间切换。
     如果当时正停在某门课的 3D 知识球里，先退回总览再切（和展开/折叠键一致）。 */
        document.getElementById("btnGalaxy").addEventListener("click", function () {
          view3dOn = !view3dOn;
          if (state.focusSubject) {
            state.focusSubject = "";
            restoreOverviewMode();
          }
          render(true);
          if (!view3dOn) fitView(0); /* 切回 2D 时重新取景 */
        });

        document.getElementById("btnCrossOnly").addEventListener("click", function () {
          /* 跨课程关系是全局视角：先退出单课聚焦 */
          if (state.focusSubject) state.focusSubject = "";
          setMode(mode === "cross" ? "all" : "cross");
        });
        /* 「展开全部章节」/「折叠全部章节」都是总览页的状态开关：
     在单课 3D 视图里点它们，先退出聚焦、回到总览页（全部 5 门课），
     再按对应的展开 / 折叠状态重排 —— 也就是「展开」永远回到全部章节的总览页。 */
        document.getElementById("btnExpand").addEventListener("click", function () {
          if (state.focusSubject) state.focusSubject = "";
          setMode("all");
        });
        document.getElementById("btnCollapse").addEventListener("click", function () {
          if (state.focusSubject) state.focusSubject = "";
          setMode("collapse");
        });
        document.getElementById("btnReset").addEventListener("click", function () {
          state.selectedId = null;
          state.hoverId = null;
          /* 3D 视图里「重置视图」= 把相机转回正视角（课程不变） */
          if (KB3D.isActive()) {
            KB3D.resetCamera();
            return;
          }
          mode = "all";
          render(true);
          fitView(0);
        });

        /* -------------------------------------------------------------------------
     9. 搜索：建议 → 定位并闪烁
     ------------------------------------------------------------------------- */
        var searchInput = document.getElementById("q");
        var suggestBox = document.getElementById("suggest");

        searchInput.addEventListener("input", function () {
          var q = searchInput.value.trim().toLowerCase();
          if (!q) {
            suggestBox.classList.remove("is-open");
            return;
          }
          var hits = kpNodes
            .filter(function (n) {
              return (
                n.label.toLowerCase().indexOf(q) >= 0 || (n.description || "").toLowerCase().indexOf(q) >= 0
              );
            })
            .slice(0, 8);
          suggestBox.innerHTML = hits.length
            ? hits
                .map(function (n) {
                  return (
                    '<button type="button" data-id="' +
                    n.id +
                    '">' +
                    n.label +
                    "<em>" +
                    n.subject +
                    " · " +
                    n.chapter +
                    "</em></button>"
                  );
                })
                .join("")
            : '<button type="button" disabled>没有匹配的知识点</button>';
          suggestBox.classList.add("is-open");
          Array.prototype.forEach.call(suggestBox.querySelectorAll("button[data-id]"), function (btn) {
            btn.addEventListener("click", function () {
              locate(btn.getAttribute("data-id"));
            });
          });
        });
        searchInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            var first = suggestBox.querySelector("button[data-id]");
            if (first) locate(first.getAttribute("data-id"));
          } else if (event.key === "Escape") {
            suggestBox.classList.remove("is-open");
          }
        });
        document.addEventListener("click", function (event) {
          if (!event.target.closest(".search")) suggestBox.classList.remove("is-open");
        });

        function locate(id) {
          var kp = kpById[id];
          if (!kp) return;
          suggestBox.classList.remove("is-open");
          searchInput.value = kp.label;
          /* 3D 视图（银河 / 知识球）：把镜头转到命中的节点并脉冲提示；
       单课视图里搜到别的课程的知识点时，先退回银河总览再定位。 */
          if (KB3D.isActive()) {
            if (!state.focusSubject || kp.subject === state.focusSubject) {
              KB3D.focusKp(id);
              return;
            }
            state.focusSubject = "";
            mode = "all";
            overviewMode = null; /* 搜索要看见全部节点，之后就按「全部章节」为准 */
            render(true);
            KB3D.focusKp(id);
            return;
          }
          if (mode !== "all") {
            mode = "all";
            overviewMode = null;
            render(true);
            fitView(0);
          }
          state.selectedId = id;
          applyHighlight();
          window.setTimeout(function () {
            centerOn(id, 1.15);
            nodeSel.classed("is-blink", function (d) {
              return d.id === id;
            });
            window.setTimeout(function () {
              nodeSel.classed("is-blink", false);
            }, 2800);
          }, 520);
        }

        /* -------------------------------------------------------------------------
     10. 启动
     ------------------------------------------------------------------------- */
        render(false);
        fitView(0);
        svg.on("click", function () {
          if (state.selectedId) {
            state.selectedId = null;
            applyHighlight();
          }
        });
      })();
    </script>
  </body>
</html>
