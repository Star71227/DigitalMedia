<!-- 项目原创部分：本文件的寻笺业务实现与集成逻辑。第三方导入库及其内部实现不属于本项目原创；AI 辅助研发见 AI_CODING_DISCLOSURE.md。此标注依据项目源码边界，非作者身份或逐行溯源证明。 -->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>知识点详情 · 计算机专业课知识图谱</title>
    <style>
      /* =====================================================================
     独立详情页（由图谱页跳转而来）
     知识点模式：① 标题 ② 知识概述与定义 ③ 核心考点 ④ 前置依赖 ⑤ 简单例题与解析
     课程模式（点击课程/章节节点）：课程概述 + 章节考查要点 + 跨课程关联 + 综合例题
     URL：?node=<名称>&key=<key>  或  ?subject=<课程>&chapter=<章节>
     ===================================================================== */
      /* 黑夜星空主题：与知识图谱页保持一套配色（深夜底 + 星点 + 半透明深色卡片） */
      :root {
        --ink: #e8f0fb;
        --text: #b9c8da;
        --muted: #8497ae;
        --line: rgb(255 255 255 / 0.12);
        --bg: #0a1120;
        --soft: rgb(255 255 255 / 0.05);
        --glass: rgb(9 15 27 / 0.82);
        --blue: #5b9bff;
        --blue-soft: rgb(91 155 255 / 0.16);
        --amber: #ffc247;
        --amber-soft: rgb(255 194 71 / 0.13);
        --red: #ff8f80;
        --green: #3fd0a8;
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(120% 90% at 50% -10%, #16233d 0%, #0b1425 40%, #05090f 100%) #05090f fixed;
        color: var(--ink);
        font:
          14.5px/1.75 "Microsoft YaHei",
          "PingFang SC",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* 星空：一层重复的小星点（每块 340×260 里十几颗位置不规则的点），滚动时固定不动 */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-repeat: repeat;
        background-size: 340px 260px;
        background-image:
          radial-gradient(1.7px 1.7px at 24px 38px, rgb(255 255 255 / 0.85), transparent 62%),
          radial-gradient(1.2px 1.2px at 128px 96px, rgb(214 230 255 / 0.7), transparent 62%),
          radial-gradient(1px 1px at 212px 26px, rgb(214 230 255 / 0.55), transparent 62%),
          radial-gradient(1.5px 1.5px at 296px 148px, rgb(255 255 255 / 0.75), transparent 62%),
          radial-gradient(1px 1px at 62px 196px, rgb(214 230 255 / 0.5), transparent 62%),
          radial-gradient(1.3px 1.3px at 168px 232px, rgb(255 255 255 / 0.65), transparent 62%),
          radial-gradient(1px 1px at 268px 208px, rgb(214 230 255 / 0.45), transparent 62%),
          radial-gradient(1.9px 1.9px at 316px 66px, rgb(236 244 255 / 0.8), transparent 62%),
          radial-gradient(1px 1px at 96px 148px, rgb(214 230 255 / 0.45), transparent 62%),
          radial-gradient(1.2px 1.2px at 244px 104px, rgb(255 255 255 / 0.6), transparent 62%),
          radial-gradient(1px 1px at 40px 108px, rgb(214 230 255 / 0.4), transparent 62%),
          radial-gradient(1.4px 1.4px at 196px 178px, rgb(255 255 255 / 0.55), transparent 62%);
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      /* ---------------- 顶栏 ---------------- */
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        padding: 12px 28px;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        background: var(--glass);
        backdrop-filter: blur(10px);
      }
      .back {
        display: inline-flex;
        height: 36px;
        padding: 0 16px;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgb(255 255 255 / 0.06);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
        transition: all 0.16s ease;
      }
      .back:hover {
        border-color: var(--blue);
        color: var(--blue);
        background: var(--blue-soft);
      }
      .bar__crumb {
        color: var(--muted);
        font-size: 12.5px;
      }
      .bar__crumb b {
        color: var(--text);
        font-weight: 600;
      }
      .bar__spacer {
        margin-left: auto;
      }
      .bar__stat {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      /* ---------------- 主体 ---------------- */
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1180px;
        padding: 28px 28px 72px;
        margin: 0 auto;
      }

      /* ① 标题 */
      .hero {
        position: relative;
        padding: 30px 34px 26px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgb(255 255 255 / 0.045);
        box-shadow: 0 14px 34px rgb(0 0 0 / 0.38);
      }
      .hero::after {
        content: "";
        position: absolute;
        top: -70px;
        right: -50px;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(91 155 255 / 0.18), transparent 68%);
      }
      .hero__subject {
        display: inline-flex;
        padding: 4px 12px;
        align-items: center;
        gap: 7px;
        border-radius: 999px;
        background: var(--blue-soft);
        color: var(--blue);
        font-size: 12px;
        font-weight: 600;
      }
      .hero__subject i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .hero h1 {
        margin: 14px 0 10px;
        font-size: clamp(1.8rem, 3vw, 2.4rem);
        line-height: 1.25;
        letter-spacing: 0.01em;
      }
      .hero__desc {
        max-width: 74ch;
        margin: 0;
        color: var(--text);
        font-size: 15px;
      }
      .hero__meta {
        display: flex;
        margin-top: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .chip {
        display: inline-flex;
        padding: 6px 13px;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--soft);
        color: var(--text);
        font-size: 12.5px;
      }
      .chip b {
        color: var(--ink);
        font-weight: 600;
      }
      .chip.diff-foundation {
        border-color: rgb(63 208 168 / 0.45);
        background: rgb(63 208 168 / 0.12);
        color: #5fe0b8;
      }
      .chip.diff-advanced {
        border-color: rgb(255 194 71 / 0.45);
        background: var(--amber-soft);
        color: #ffc247;
      }
      .chip.diff-challenge {
        border-color: rgb(255 143 128 / 0.45);
        background: rgb(255 143 128 / 0.12);
        color: var(--red);
      }

      .grid {
        display: grid;
        margin-top: 20px;
        gap: 18px;
        grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr);
        align-items: start;
      }
      @media (max-width: 1000px) {
        .grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .col {
        display: grid;
        gap: 18px;
      }

      .card {
        padding: 22px 26px 24px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgb(255 255 255 / 0.045);
        box-shadow: 0 10px 26px rgb(0 0 0 / 0.3);
      }
      .card__head {
        display: flex;
        margin-bottom: 14px;
        align-items: center;
        gap: 11px;
      }
      .card__no {
        display: grid;
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 8px;
        background: var(--blue-soft);
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
      }
      .card__head h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.01em;
      }
      .card__head em {
        margin-left: auto;
        color: var(--muted);
        font-size: 11.5px;
        font-style: normal;
      }

      .card p {
        margin: 0 0 12px;
        color: var(--text);
      }
      .card p:last-child {
        margin-bottom: 0;
      }
      .card strong {
        color: var(--ink);
      }
      .def {
        padding: 14px 16px;
        border: 1px solid rgb(91 155 255 / 0.3);
        border-radius: 10px;
        background: linear-gradient(180deg, rgb(91 155 255 / 0.14), rgb(255 255 255 / 0.02));
        color: #cfe0f8;
      }
      ol.points,
      ul.points {
        padding: 0;
        margin: 0;
        list-style: none;
        counter-reset: pt;
      }
      ol.points > li {
        position: relative;
        padding: 9px 0 9px 34px;
        border-bottom: 1px dashed var(--line);
        color: var(--text);
      }
      ol.points > li:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      ol.points > li::before {
        counter-increment: pt;
        content: counter(pt);
        position: absolute;
        top: 11px;
        left: 0;
        display: grid;
        width: 21px;
        height: 21px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--soft);
        color: var(--blue);
        font-size: 11px;
        font-weight: 700;
      }

      /* ④ 前置依赖（可点击 → 对应知识点详情页） */
      .rel {
        display: grid;
        gap: 9px;
      }
      .rel__group + .rel__group {
        margin-top: 4px;
      }
      .rel__label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 11.5px;
        letter-spacing: 0.06em;
      }
      .rel__label span {
        flex: 1 1 auto;
        height: 1px;
        background: var(--line);
      }
      .rel__list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .rel__item {
        display: inline-flex;
        padding: 7px 13px;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgb(255 255 255 / 0.05);
        color: var(--text);
        font-size: 13px;
        transition: all 0.16s ease;
      }
      .rel__item:hover {
        border-color: var(--blue);
        background: var(--blue-soft);
        color: var(--blue);
        transform: translateY(-1px);
      }
      .rel__item--cross {
        border-style: dashed;
        border-color: rgb(91 155 255 / 0.45);
      }
      .rel__item em {
        color: var(--muted);
        font-size: 11px;
        font-style: normal;
      }
      .rel__item.is-target {
        border-color: var(--green);
        background: rgb(63 208 168 / 0.12);
        color: #5fe0b8;
      }
      .empty {
        padding: 12px 14px;
        border: 1px dashed var(--line);
        border-radius: 10px;
        background: var(--soft);
        color: var(--muted);
        font-size: 13px;
      }

      /* 章节卡片（课程模式） */
      .chapter {
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--soft);
      }
      .chapter + .chapter {
        margin-top: 12px;
      }
      .chapter.is-focus {
        border-color: var(--blue);
        background: rgb(91 155 255 / 0.13);
        box-shadow: 0 0 0 3px rgb(91 155 255 / 0.18);
      }
      .chapter__head {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .chapter__head b {
        font-size: 14.5px;
      }
      .chapter__head em {
        margin-left: auto;
        color: var(--muted);
        font-size: 11.5px;
        font-style: normal;
      }
      .chapter__key {
        margin: 8px 0 12px !important;
        color: var(--text) !important;
        font-size: 13.5px;
      }

      /* ⑤ 例题 */
      .quiz__q {
        padding: 16px 18px;
        border: 1px solid rgb(184 122 12 / 0.34);
        border-radius: 10px;
        background: var(--amber-soft);
        color: #f0d79a;
      }
      .quiz__q b {
        display: block;
        margin-bottom: 6px;
        color: var(--amber);
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      .quiz__step {
        display: grid;
        margin-top: 14px;
        gap: 10px;
      }
      .quiz__step > div {
        display: grid;
        padding: 12px 14px;
        gap: 8px;
        grid-template-columns: 62px minmax(0, 1fr);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--soft);
      }
      .quiz__step span {
        color: var(--blue);
        font-size: 12px;
        font-weight: 600;
      }
      .quiz__step p {
        margin: 0;
        color: var(--text);
      }
      .quiz__ans {
        margin-top: 14px;
        padding: 13px 16px;
        border: 1px solid rgb(63 208 168 / 0.4);
        border-radius: 10px;
        background: rgb(63 208 168 / 0.12);
        color: #7fe8c4;
      }
      .quiz__ans b {
        color: #a8f2da;
      }

      /* 侧栏 */
      .side__list {
        display: grid;
        gap: 6px;
        max-height: 340px;
        overflow: auto;
        padding-right: 4px;
      }
      .side__list a {
        display: flex;
        padding: 7px 10px;
        align-items: center;
        gap: 8px;
        border-radius: 8px;
        color: var(--text);
        font-size: 13px;
      }
      .side__list a:hover {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .side__list a.is-current {
        background: var(--blue);
        color: #fff;
        font-weight: 600;
      }
      .side__list a em {
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
        font-style: normal;
      }
      .side__list a.is-current em {
        color: rgb(255 255 255 / 0.8);
      }
      .pathbar {
        display: flex;
        margin-top: 18px;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .pathbar i {
        color: #5d708a;
        font-style: normal;
      }
      /* 同名知识点提示：图谱中「数组」同时存在于 C语言 与 数据结构 */
      .twin {
        margin-top: 16px;
        padding: 10px 14px;
        border: 1px dashed rgb(255 194 71 / 0.45);
        border-radius: 10px;
        background: var(--amber-soft);
        color: #e8c07a;
        font-size: 12.5px;
      }
      .twin a {
        color: var(--blue);
        text-decoration: underline;
      }

      .notfound {
        padding: 60px 0;
        text-align: center;
      }
      .notfound h1 {
        margin: 0 0 10px;
        font-size: 1.6rem;
      }
      .notfound p {
        margin: 0 0 22px;
        color: var(--text);
      }

      @media print {
        .bar {
          position: static;
        }
        .back {
          display: none;
        }
        .card {
          break-inside: avoid;
        }
      }
      /* =====================================================================
   讲义纸面主题（覆盖上面的星空深色变量，不改任何 DOM 结构）
   取值与应用里的学习讲义保持一致：
     --lm-canvas #F7F6F3 / --bp-ink #061325 / 正文 #455F77 / 眉标 #688CA7
     卡片 1px rgb(91 136 168 / .24) + 18px 3px 圆角 + 0 12px 28px rgb(8 57 98 / .055)
     编号 #0B7FC1 用 Georgia，标题用宋体，正文用无衬线
   ===================================================================== */
      :root {
        --ink: #14202e;
        --text: #455f77;
        --muted: #688ca7;
        --line: rgb(91 136 168 / 0.26);
        --bg: #f7f6f3;
        --soft: rgb(255 255 255 / 0.78);
        --glass: rgb(255 255 255 / 0.92);
        --blue: #0b7fc1;
        --blue-soft: rgb(11 127 193 / 0.1);
        --amber: #a8700c;
        --amber-soft: rgb(217 154 24 / 0.12);
        --red: #b04a60;
        --green: #0f9d76;
        --radius: 12px;
        --paper-serif: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
        --paper-sans: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        --paper-num: Georgia, "Times New Roman", serif;
        --paper-shadow: 0 12px 28px rgb(8 57 98 / 0.055);
        --paper-card: rgb(255 255 255 / 0.82);
      }

      /* 纸面底色：去掉夜空渐变与星点，换成讲义那种米白纸 */
      body {
        background: linear-gradient(180deg, #fbfaf7 0%, #f4f2ed 42%, #efece6 100%) #f4f2ed fixed;
        color: var(--ink);
        font: 14.5px/1.8 var(--paper-sans);
      }
      body::before {
        display: none !important;
      }

      /* 顶栏：白纸悬浮条 */
      .bar {
        background: var(--glass);
        border-bottom: 1px solid var(--line);
        box-shadow: 0 1px 0 rgb(91 136 168 / 0.12);
      }
      .back {
        background: #fff;
        color: var(--text);
        border-color: var(--line);
      }
      .back:hover {
        border-color: var(--blue);
        color: var(--blue);
        background: var(--blue-soft);
      }
      .bar__crumb {
        color: var(--muted);
      }
      .bar__crumb b {
        color: var(--ink);
      }
      .bar__stat {
        color: var(--muted);
        font-family: var(--paper-num);
        letter-spacing: 0.06em;
      }

      /* 标题统一宋体、正文统一无衬线、数字统一 Georgia —— 与讲义排版一致 */
      h1,
      h2,
      h3,
      h4,
      .hero__title,
      .card__head b,
      .chapter__head b,
      .side__title {
        font-family: var(--paper-serif);
        color: var(--ink);
        letter-spacing: 0.01em;
      }
      .hero__desc,
      .card p,
      .chapter__key,
      .quiz__step p,
      .notfound p {
        color: var(--text);
      }
      .card__head em,
      .chapter__head em,
      .rel__label,
      .side__list a em {
        color: var(--muted);
        font-family: var(--paper-num);
        font-style: normal;
      }

      /* 卡片：讲义式的浅描边 + 不对称圆角 + 极淡投影 */
      .card,
      .chapter,
      .side,
      .hero,
      .quiz,
      .notfound {
        background: var(--paper-card);
        border: 1px solid var(--line);
        border-radius: 18px 3px 18px 3px;
        box-shadow: var(--paper-shadow);
      }
      .card__head,
      .chapter__head {
        border-bottom: 1px solid var(--line);
      }

      /* 编号 / 数字徽标：讲义里的蓝色 Georgia 数字 */
      .hero__index,
      .card__index,
      .chapter__index,
      .quiz__index,
      .side__index,
      .bar__stat b {
        color: var(--blue);
        font-family: var(--paper-num);
      }

      /* 小胶囊标签（重点 / 章节 / 前置依赖 / 跨课程等） */
      .rel__item,
      .empty,
      .chip,
      .tag,
      .pill,
      .badge {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--text);
      }
      .rel__item {
        padding: 5px 12px;
      }
      .rel__item:hover,
      .side__list a:hover {
        border-color: var(--blue);
        color: var(--blue);
        background: var(--blue-soft);
      }
      .side__list a {
        color: var(--text);
      }
      .pathbar {
        color: var(--muted);
      }

      /* 强调色：沿用讲义的蓝(考点)/琥珀(易错)/红(风险)/绿(掌握) */
      mark,
      .is-key,
      .is-important {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .is-warn,
      .is-danger {
        color: var(--red);
      }
      .is-ok {
        color: var(--green);
      }

      /* 表格 / 代码块也换成纸面观感 */
      table {
        border-color: var(--line);
      }
      th {
        background: #fff;
        color: var(--ink);
        font-family: var(--paper-serif);
      }
      td {
        color: var(--text);
      }
      code,
      pre {
        background: #fff;
        border: 1px solid var(--line);
        color: #1f3a52;
        border-radius: 10px;
      }

      /* 滚动条：浅色细条 */
      * {
        scrollbar-color: rgb(91 136 168 / 0.35) transparent;
        scrollbar-width: thin;
      }

      /* ---------------------------------------------------------------------
   「题目 / 解析要点」两块原来在深色主题下用的是亮色字（#ffc247 压琥珀底、
   #7fe8c4 压薄荷底），换成纸面底色后几乎同色、看不清。这里把文字压深、
   底色调浅，做成讲义里那种"浅底深字"的高对比配色：
     题目：底 #fff8e8 / 字 #6b4708（约 8:1）
     解析：底 #eefaf5 / 字 #0b5f47（约 9:1）
   --------------------------------------------------------------------- */
      .quiz__q {
        background: linear-gradient(180deg, #fff8e8, #fdf4e0);
        border: 1px solid rgb(184 122 12 / 0.32);
        color: #6b4708;
      }
      .quiz__q b {

            var uniq = uniqByKey(list);
            return (
              '<div class="rel__group"><div class="rel__label">' +
              title +
              "<span></span>" +
              uniq.length +
              ' 个</div><div class="rel__list">' +
              uniq
                .map(function (m) {
                  return kpChip(m, isCross);
                })
                .join("") +
              "</div></div>"
            );
          }
          var hasRel = rel.prereq.length || rel.next.length || rel.crossIn.length || rel.crossOut.length;
          var relHtml = hasRel
            ? group("前置依赖 · 学它之前建议先掌握", rel.prereq) +
              group("后继知识点 · 学完之后通常继续学", rel.next) +
              group("跨课程关联 · 其他课程中的对应内容", rel.crossIn.concat(rel.crossOut), true)
            : '<div class="empty">该知识点在图谱中没有记录前置依赖，可作为本课程的入门节点直接学习。</div>';

          var chapterHtml = sameChapter.length
            ? '<div class="rel__list">' +
              uniqByKey(sameChapter)
                .slice(0, 16)
                .map(function (m) {
                  return kpChip(m);
                })
                .join("") +
              "</div>"
            : '<div class="empty">本章节暂无其他知识点。</div>';

          var navHtml = sameSubject
            .map(function (m) {
              return (
                '<a class="' +
                (m.key === n.key ? "is-current" : "") +
                '" href="' +
                detailHref(m) +
                '">' +
                esc(m.label) +
                "<em>" +
                esc(m.chapter) +
                "</em></a>"
              );
            })
            .join("");

          /* 同名知识点：只给出名称参数时会有歧义，这里给出切换入口 */
          var twins = (byLabel[n.label] || []).filter(function (m) {
            return m.key !== n.key;
          });
          var twinHtml = twins.length
            ? '<div class="twin">图谱中存在同名知识点，当前展示的是《' +
              esc(n.subject) +
              "》的「" +
              esc(n.label) +
              "」。切换到：" +
              twins
                .map(function (m) {
                  return '<a href="' + detailHref(m) + '">' + esc(m.label) + "（" + esc(m.subject) + "）</a>";
                })
                .join("、") +
              "</div>"
            : "";

          document.getElementById("crumb").innerHTML = "知识点详情 <b>" + esc(n.subject) + "</b>";
          document.getElementById("stat").textContent =
            "本课程共 " + sameSubject.length + " 个知识点 · 关联资源 " + (n.resourceCount || 0) + " 个";

          document.getElementById("root").innerHTML =
            '<section class="hero">' +
            '<span class="hero__subject"><i></i>' +
            esc(n.subject) +
            " · " +
            esc(n.chapter) +
            "</span>" +
            "<h1>" +
            esc(n.label) +
            "</h1>" +
            '<p class="hero__desc">' +
            (n.description
              ? esc(n.description)
              : "《" + esc(n.subject) + "》" + esc(n.chapter) + "章节知识点") +
            "</p>" +
            '<div class="hero__meta">' +
            '<span class="chip diff-' +
            esc(n.difficulty) +
            '">难度：<b>' +
            diffText(n.difficulty) +
            "</b></span>" +
            '<span class="chip">前置依赖：<b>' +
            uniqByKey(rel.prereq).length +
            " 个</b></span>" +
            '<span class="chip">后续知识：<b>' +
            uniqByKey(rel.next).length +
            " 个</b></span>" +
            '<span class="chip">跨课程关联：<b>' +
            uniqByKey(rel.crossIn.concat(rel.crossOut)).length +
            " 个</b></span>" +
            '<span class="chip">关联资源：<b>' +
            (n.resourceCount || 0) +
            " 个</b></span>" +
            "</div>" +
            '<div class="pathbar">' +
            '<a href="' +
            subjectHref(n.subject) +
            '">' +
            esc(n.subject) +
            "</a><i>›</i><span>" +
            esc(n.chapter) +
            "</span><i>›</i><span>" +
            esc(n.label) +
            "</span></div>" +
            twinHtml +
            "</section>" +
            '<div class="grid">' +
            '<div class="col">' +
            '<section class="card"><div class="card__head"><span class="card__no">1</span><h2>知识概述与定义</h2><em>CONCEPT</em></div>' +
            '<p class="def">' +
            defSentence +
            "</p>" +
            "<p>学习 " +
            esc(n.label) +
            " 时，建议按以下四条线索建立完整认知：</p>" +
            '<ol class="points">' +
            concept
              .map(function (c) {
                return "<li>" + esc(c) + "</li>";
              })
              .join("") +
            "</ol></section>" +
            '<section class="card"><div class="card__head"><span class="card__no">2</span><h2>核心考点</h2><em>KEY POINTS</em></div>' +
            "<p>该知识点在考试与面试中主要以以下形式出现：</p>" +
            '<ol class="points">' +
            exam
              .map(function (c) {
                return "<li>" + esc(c) + "</li>";
              })
              .join("") +
            "</ol></section>" +
            '<section class="card"><div class="card__head"><span class="card__no">3</span><h2>简单例题与解析</h2><em>EXAMPLE</em></div>' +
            quizHtml(n.subject, n.label, seed) +
            "</section>" +
            "</div>" +
            '<div class="col">' +
            '<section class="card"><div class="card__head"><span class="card__no">4</span><h2>知识点前置依赖</h2><em>PREREQUISITE</em></div>' +
            '<div class="rel">' +
            relHtml +
            "</div></section>" +
            '<section class="card"><div class="card__head"><span class="card__no">5</span><h2>同章节知识点</h2><em>CHAPTER</em></div>' +
            chapterHtml +
            "</section>" +
            '<section class="card"><div class="card__head"><span class="card__no">6</span><h2>' +
            esc(n.subject) +
            " · 全部知识点</h2><em>NAV</em></div>" +
            '<div class="side__list">' +
            navHtml +
            "</div></section>" +
            "</div>" +
            "</div>";
        }

        /* ---------------- 课程模式（点击课程 / 章节节点跳转而来） ---------------- */
        function renderCourse(subject) {
          var courseNodes = nodes.filter(function (n) {
            return n.subject === subject;
          });
          var chapterNames = [];
          var byChapter = {};
          courseNodes.forEach(function (n) {
            if (!byChapter[n.chapter]) {
              byChapter[n.chapter] = [];
              chapterNames.push(n.chapter);
            }
            byChapter[n.chapter].push(n);
          });

          /* 跨课程关联：本课程与其他课程之间的 cross_subject 关系 */
          var crossBySubject = {};
          edges.forEach(function (e) {
            if (e.type !== "cross_subject") return;
            var s = byId[e.source],
              t = byId[e.target];
            if (!s || !t) return;
            var other = null;
            if (s.subject === subject && t.subject !== subject)
              other = { subject: t.subject, self: s, peer: t };
            else if (t.subject === subject && s.subject !== subject)
              other = { subject: s.subject, self: t, peer: s };
            if (!other) return;
            if (!crossBySubject[other.subject]) crossBySubject[other.subject] = [];
            crossBySubject[other.subject].push(other);
          });
          var crossSubjects = Object.keys(crossBySubject);
          var crossHtml = crossSubjects.length
            ? '<div class="rel__group"><div class="rel__label">关联课程<span></span>' +
              crossSubjects.length +
              ' 门</div><div class="rel__list">' +
              crossSubjects
                .map(function (s2) {
                  return (
                    '<a class="rel__item rel__item--cross" href="' +
                    subjectHref(s2) +
                    '">' +
                    esc(s2) +
                    "<em>" +
                    crossBySubject[s2].length +
                    " 条关联</em></a>"
                  );
                })
                .join("") +
              "</div></div>" +
              '<div class="rel__group" style="margin-top:12px"><div class="rel__label">具体跨课程知识点<span></span></div>' +
              '<div class="rel__list">' +
              crossSubjects
                .reduce(function (acc, s2) {
                  return acc.concat(
                    crossBySubject[s2].map(function (p) {
                      return kpChip(p.peer, true);
                    }),
                  );
                }, [])
                .map(function (html) {
                  return html;
                })
                .join("") +
              "</div></div>"
            : '<div class="empty">该课程在图谱中暂无跨课程关联记录。</div>';

          var focus = qChapter || "";
          var chapterHtml = chapterNames
            .map(function (name) {
              var list = byChapter[name];
              var isFocus = focus && (name === focus || name.indexOf(focus) >= 0 || focus.indexOf(name) >= 0);
              var keyPoint =
                "本章共 " +
                list.length +
                " 个知识点，考查重点是" +
                list
                  .slice(0, 3)
                  .map(function (n) {
                    return n.label;
                  })
                  .join("、") +
                (list.length > 3 ? " 等" : "") +
                "；答题时注意与相邻章节知识点的结合应用。";
              return (
                '<div class="chapter' +
                (isFocus ? " is-focus" : "") +
                '" id="ch-' +
                encodeURIComponent(name) +
                '">' +
                '<div class="chapter__head"><b>' +
                esc(name) +
                "</b><em>" +
                list.length +
                " 个知识点</em></div>" +
                '<p class="chapter__key">' +
                esc(keyPoint) +
                "</p>" +
                '<div class="rel__list">' +
                list
                  .map(function (n) {
                    return kpChip(n);
                  })
                  .join("") +
                "</div></div>"
              );
            })
            .join("");

          var exam = (EXAM[subject] || EXAM["数据结构"]).map(function (t) {
            return t.replace(/\{n\}/g, subject + "中的核心知识点");
          });

          document.getElementById("crumb").innerHTML = "课程详情 <b>" + esc(subject) + "</b>";
          document.getElementById("stat").textContent =
            "共 " + chapterNames.length + " 个章节 · " + courseNodes.length + " 个知识点";

          document.getElementById("root").innerHTML =
            '<section class="hero">' +
            '<span class="hero__subject"><i></i>课程' +
            (focus ? " · 聚焦章节 " + esc(focus) : "") +
            "</span>" +
            "<h1>" +
            esc(subject) +
            "</h1>" +
            '<p class="hero__desc">《' +
            esc(subject) +
            "》共 " +
            chapterNames.length +
            " 个章节、" +
            courseNodes.length +
            " 个知识点，覆盖" +
            chapterNames.slice(0, 4).map(esc).join("、") +
            (chapterNames.length > 4 ? " 等" : "") +
            "内容。点击下方任意知识点可进入其独立详情页。</p>" +
            '<div class="hero__meta">' +
            '<span class="chip">章节：<b>' +
            chapterNames.length +
            " 个</b></span>" +
            '<span class="chip">知识点：<b>' +
            courseNodes.length +
            " 个</b></span>" +
            '<span class="chip">关联课程：<b>' +
            crossSubjects.length +
            " 门</b></span>" +
            "</div>" +
            '<div class="pathbar"><span>图谱位置</span><i>›</i><span>' +
            esc(subject) +
            "</span></div>" +
            "</section>" +
            '<div class="grid">' +
            '<div class="col">' +
            '<section class="card"><div class="card__head"><span class="card__no">1</span><h2>课程概述与章节结构</h2><em>OVERVIEW</em></div>' +
            '<p class="def">《' +
            esc(subject) +
            "》的知识图谱由 " +
            chapterNames.length +
            " 个章节、" +
            courseNodes.length +
            " 个知识点与 " +
            edges.filter(function (e) {
              var s = byId[e.source],
                t = byId[e.target];
              return s && t && s.subject === subject && t.subject === subject;
            }).length +
            " 条课程内关联构成，下列章节按图谱中的顺序展开。</p>" +
            chapterHtml +
            "</section>" +
            '<section class="card"><div class="card__head"><span class="card__no">2</span><h2>核心考点</h2><em>KEY POINTS</em></div>' +
            '<ol class="points">' +
            exam
              .map(function (c) {
                return "<li>" + esc(c) + "</li>";
              })
              .join("") +
            "</ol></section>" +
            '<section class="card"><div class="card__head"><span class="card__no">3</span><h2>综合例题与解析</h2><em>EXAMPLE</em></div>' +
            quizHtml(subject, subject + " 的多个知识点", hash(subject)) +
            "</section>" +
            "</div>" +
            '<div class="col">' +
            '<section class="card"><div class="card__head"><span class="card__no">4</span><h2>跨课程关联</h2><em>CROSS SUBJECT</em></div>' +
            '<div class="rel">' +
            crossHtml +
            "</div></section>" +
            '<section class="card"><div class="card__head"><span class="card__no">5</span><h2>章节导航</h2><em>CHAPTER</em></div>' +
            '<div class="side__list">' +
            chapterNames
              .map(function (name) {
                return (
                  '<a href="#ch-' +
                  encodeURIComponent(name) +
                  '">' +
                  esc(name) +
                  "<em>" +
                  byChapter[name].length +
                  "</em></a>"
                );
              })
              .join("") +
            "</div></section>" +
            '<section class="card"><div class="card__head"><span class="card__no">6</span><h2>' +
            esc(subject) +
            " · 全部知识点</h2><em>NAV</em></div>" +
            '<div class="side__list">' +
            courseNodes
              .map(function (m) {
                return (
                  '<a href="' + detailHref(m) + '">' + esc(m.label) + "<em>" + esc(m.chapter) + "</em></a>"
                );
              })
              .join("") +
            "</div></section>" +
            "</div>" +
            "</div>";

          /* 聚焦章节滚到视野内 */
          if (focus) {
            var target = document.querySelector(".chapter.is-focus");
            if (target)
              window.setTimeout(function () {
                target.scrollIntoView({ behavior: "smooth", block: "center" });
              }, 120);
          }
        }

        /* ---------------- 返回按钮：优先回退到图谱页，否则直接跳 ---------------- */
        document.getElementById("btnBack").addEventListener("click", function (event) {
          if (window.history.length > 1 && document.referrer.indexOf("knowledge-graph") >= 0) {
            event.preventDefault();
            window.history.back();
          }
        });

        if (current) renderKnowledge(current);
        else if (isCourse) renderCourse(courseSubject);
        else renderNotFound();
      })();
    </script>
  </body>
</html>
