<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>寻笺 LearnMate</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        /* 封面取自登录入场动画（书页 logo 定版那一帧），见 packaging\desktop\tools\make-cover-assets.ps1 */
        background: #eef3ee url("cover.jpg") center / cover no-repeat;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        color: #2c3a33;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 0 18px;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
      }
      .statusbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px 0;
        background: linear-gradient(to top, rgba(255, 255, 255, 0.92) 55%, rgba(255, 255, 255, 0));
      }
      .spinner {
        flex: none;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 2px solid rgba(24, 132, 104, 0.22);
        border-top-color: #148468;
        animation: spin 900ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        font-size: 13px;
        line-height: 1.5;
        color: #33443c;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="statusbar">
      <span class="spinner" aria-hidden="true"></span>
      <div id="status">正在准备…</div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const initial = params.get("title");
      const el = document.getElementById("status");
      if (initial) el.textContent = initial;
      window.__setStatus = (text) => {
        el.textContent = text;
      };
    </script>
  </body>
</html>
